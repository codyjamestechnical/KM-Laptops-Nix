# Weekly bump of all flake inputs (nixpkgs, nixos-hardware, nix-flatpak).
# Opens a PR so you can review what's changing before the fleet picks it up.
# Merge the PR and every laptop upgrades on its next hourly run.
name: Update flake inputs

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: DeterminateSystems/update-flake-lock@v24
        with:
          pr-title: "Update flake inputs"
          commit-msg: "flake.lock: update inputs"
