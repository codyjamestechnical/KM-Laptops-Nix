name: Update flake.lock

on:
  schedule:
    # Daily at 04:00 UTC (23:00 America/New_York during EST)
    - cron: "0 4 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Update flake.lock
        run: nix flake update

      - name: Verify the configuration still evaluates
        run: nix flake check --all-systems

      - name: Commit and push if changed
        run: |
          if git diff --quiet flake.lock; then
            echo "flake.lock is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898024+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "flake.lock: automatic update ($(date -u +%Y-%m-%d))"
          git push
